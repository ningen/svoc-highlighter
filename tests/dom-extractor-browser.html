<!doctype html><html><body>
<div id="fixture">
  <p id="inline">Set <code>minimumReleaseAge</code> to <code>3 days</code> for stable dependencies.</p>
  <nav><p id="nav">Navigation should not be parsed.</p></nav>
  <pre id="pre">const x = 1;</pre>
  <p id="body">This option supports template syntax.</p>
  <ul><li id="result">GitHubDocs A long search result snippet that should not be parsed as one grammatical sentence.</li></ul>
</div>
<script src="../dom-extractor.js"></script>
<script>
(() => {
  const failures=[]; let checks=0;
  function eq(name,actual,expected){checks++; if(actual!==expected) failures.push(`${name}: expected=${expected} actual=${actual}`);}
  eq('inline code preserved', SVOCDom.collectText(document.querySelector('#inline')).text, 'Set minimumReleaseAge to 3 days for stable dependencies.');
  const docsIds=SVOCDom.collectCandidateBlocks(document,'docs.example.com').map(x=>x.id);
  eq('nav excluded', docsIds.includes('nav'), false);
  eq('body included', docsIds.includes('body'), true);
  eq('pre excluded', docsIds.includes('pre'), false);
  const googleIds=SVOCDom.collectCandidateBlocks(document,'www.google.com').map(x=>x.id);
  eq('google result li excluded', googleIds.includes('result'), false);
  const out=document.createElement('div'); out.id='svoc-test-result';
  out.textContent=failures.length ? `FAIL ${failures.join(' | ')}` : `PASS ${checks}/5`;
  document.body.append(out);
})();
</script>
</body></html>
